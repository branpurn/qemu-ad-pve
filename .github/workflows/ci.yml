name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck-nested-kvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (dkms + L1 scripts + setup.sh tool)
        run: |
          shellcheck --version
          # Scope to nested-KVM paths only; existing qemu-ad-pve harness scripts
          # are not yet shellcheck-clean and are not part of this integration.
          mapfile -t scripts < <(git ls-files 'dkms/**/*.sh' 'scripts/l1-w10/*.sh' 'setup.sh' 'setup/**/*.sh')
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck -x "${scripts[@]}"
  pytest-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: pytest (gen-launch / kernel-watch tools)
        run: python -m pytest -q tests/test_gen_launch.py tests/test_check_new_kernel.py
      - name: generated launch script is valid bash and shellcheck-clean
        run: |
          python tools/gen-launch.py tests/data/qm-showcmd-9200.txt -o /tmp/launch.sh
          bash -n /tmp/launch.sh
          shellcheck /tmp/launch.sh
  setup-tool:
    # setup.sh (one-command PVE setup): pure-logic unit tests + a dry-run smoke test against
    # stub PVE commands and a fake sysfs. Python 3.9 = oldest supported, 3.13 = PVE 9 / Debian 13.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: byte-compile (stdlib-only package)
        run: python -m py_compile setup/qad_setup/*.py setup/l1/qad-qmp.py
      - name: pytest tests/setup
        run: python -m pytest -q tests/setup
      - name: setup.sh --help works
        run: ./setup.sh --help && ./setup.sh install --help
