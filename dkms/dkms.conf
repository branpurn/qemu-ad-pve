# DKMS definition for an out-of-tree kvm + kvm-amd + kvm-intel build.
#
# TARGET: the nested L1 guest kernel ONLY. Do not register this on the bare-metal
# PVE host: the host keeps its stock kernel and stock kvm modules (see
# ../docs/roadmap.md, "Host impact"). scripts/l1-dkms.sh refuses to run on a PVE
# host / bare metal.
#
# Before `dkms add`, populate src/<upstream-version>/ with
#   ./fetch-kvm-source.sh <upstream-version>
# (the build never touches the network).
PACKAGE_NAME="kvm-l1"
PACKAGE_VERSION="0.1.0"

# No automatic rebuild on kernel upgrades while this is a skeleton: a missing
# src/<new-version>/ would fail the build, and a surprise module swap is not
# wanted. Flip to "yes" once the CI build step exists (see the TODO in
# .github/workflows/kernel-watch.yml).
AUTOINSTALL="no"

MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} all"
CLEAN="make clean"

BUILT_MODULE_NAME[0]="kvm"
BUILT_MODULE_LOCATION[0]="build/arch/x86/kvm"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="kvm-amd"
BUILT_MODULE_LOCATION[1]="build/arch/x86/kvm"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="kvm-intel"
BUILT_MODULE_LOCATION[2]="build/arch/x86/kvm"
DEST_MODULE_LOCATION[2]="/updates/dkms"
