# qemu-ad-pve setup.sh answers file.  Use:  ./setup.sh install --config my.ini [--yes]
# Every key is optional; unset keys use the default shown. Unknown keys are rejected.
# Secrets (l2.product_key, l2.admin_password) are read from here but never written back
# to /var/lib/qemu-ad/setup/config.ini. Keep this file root-only if you put them here.

[l1]
# VMID of the new L1 VM (auto = next free VMID from pvesh)
# vmid = auto

# Name of the L1 VM
# name = qad-l1

# Storage for the L1 disks (needs content 'images')
# storage = auto

# Storage for the cloud-init seed ISO (needs content 'iso')
# iso_storage = auto

# Host bridge for the L1 NIC (L1 needs internet for apt/DKMS)
# bridge = vmbr0

# L1 RAM in MiB (must hold the L2 RAM plus ~4 GiB)
# memory_mb = 12288

# L1 vCPUs
# cores = 8

# L1 root disk size in GiB (DKMS sources, QEMU, staging ISOs)
# disk_gb = 48

# L1 address: 'dhcp' or CIDR like 192.168.1.50/24
# ip = dhcp

# Gateway when l1.ip is static
# gateway = 

# DNS server when l1.ip is static (default: the gateway)
# dns = 

# Debian 13 *generic* cloud image (standard kernel; genericcloud's cloud kernel is untested)
# debian_image_url = https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2

# Use this local qcow2 instead of downloading (path on the PVE host)
# debian_image = 

# apt-mark hold the L1 kernel (DKMS AUTOINSTALL is off in dkms/)
# hold_kernel = yes

# Source for the patched KVM: debian (linux-source of the L1 kernel, like the lab build) or
# upstream (dkms/fetch-kvm-source.sh)
# kvm_source = debian

# qemu-ad-pve binary for L2: copy (host /opt/qemu-ad, read-only), build (qemu-ad-pve.sh build
# inside L1) or auto (copy if present on host, else build)
# qemu_ad = auto

# Install a pre-start hookscript (GPU exclusivity + vfio-pci bind) into a snippets storage:
# auto|yes|no
# hookscript = auto

# Storage with content 'snippets' for the hookscript
# snippets_storage = auto

# Start L1 when the host boots (GPU is then taken from other VMs)
# onboot = no

# Seconds qm/host shutdown waits for L1 (L2 shuts down first)
# shutdown_timeout = 300

[gpu]
# Host PCI slot of the GPU, e.g. 0000:01:00 (all functions are passed)
# slot = auto

# OVMF 64-bit MMIO aperture (X-PciMmio64Mb) for L1 and L2
# mmio64_mb = 65536

[l2]
# How to create the Windows L2: iso (install from a Windows ISO), image (existing qcow2/raw), none
# (L1 only)
# source = iso

# Windows ISO: PVE volid (local:iso/Win10.iso) or absolute path
windows_iso = local:iso/Win10_22H2_English_x64.iso

# Existing Windows disk image (qcow2/raw) on the PVE host; must boot on SATA/AHCI
# image = 

# Windows disk size in GiB (iso source)
# disk_gb = 128

# L2 RAM in MiB
# memory_mb = 6144

# L2 vCPUs
# cores = 4

# generate (unattended install), none (interactive via VNC) or a path to your own autounattend.xml
# autounattend = generate

# 10 or 11 (11 adds the TPM/SecureBoot setup bypass; untested)
# windows_version = 10

# Image name in install.wim (auto: 'Windows <ver> Pro')
# windows_edition = auto

# Your own product key (empty = none; Setup may ask, see docs)
# product_key = 

# Local administrator created by autounattend
# admin_user = qad

# Password for admin_user (empty = random, shown once at the end)
# admin_password = 

# Windows computer name
# computer_name = QAD-L2

# Windows time zone id (e.g. 'Eastern Standard Time')
# timezone = UTC

# Windows UI/input locale
# locale = en-US

# L2 -cpu value (plain host gave Code 0 in the lab)
# cpu = host

# Isolated L1<->L2 network (no NAT, no internet for L2)
# net_cidr = 10.254.77.0/24

# Max minutes to wait for the Windows install/first boot
# install_timeout_min = 240

# VNC display of the L2 *inside L1* during install (reach it with ssh -L)
# vnc = 127.0.0.1:0

[stage]
# NVIDIA Windows driver .exe on the PVE host (installed at first GPU boot)
# nvidia_driver = 

# python-3.x-amd64.exe on the PVE host
# python_installer = 

# Directory of Windows wheels (*.whl, optional SHA256SUMS*) on the PVE host
# wheelhouse = 

# OpenSSH-Win64.zip (Win32-OpenSSH release) for offline sshd in L2
# openssh_zip = 

# Comma-separated extra files copied to the staging ISO root
# extra_files = 

# Only with --download-proprietary: 'url sha256 [name]' entries separated by ';'. Downloaded
# INSIDE L1, sha256-checked, put on the staging ISO
# downloads = 

[verify]
# Run the PyTorch CUDA check in L2: auto (if torch was staged), yes, no
# cuda = auto
